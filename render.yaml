# render.yaml — Declarative Render deployment for Trackify backend
# Docs: https://render.com/docs/blueprint-spec
#
# This file configures the Express backend only.
# The React/Vite frontend is deployed separately on Vercel.
#
# HOW TO USE:
#   1. Push this file to GitHub (branch: new_main).
#   2. In Render dashboard → New → Blueprint → connect IPDL_Project repo.
#   3. Render will read this file and create the service automatically.
#   4. After the first deploy, go to the service's Environment tab and fill in:
#        JWT_SECRET, SARVAM_API_KEY, GEMINI_API_KEY, ALLOWED_ORIGIN
#      (PORT is set by Render automatically — do NOT add it manually.)
# NOTE: Free plan uses /tmp for SQLite — data resets on every restart/redeploy.
# Upgrade to Starter ($7/mo) and uncomment the disk section for persistent data.

services:
  - type: web
    name: trackify-backend
    runtime: node
    region: singapore          # closest region for Mumbai users
    plan: free
    branch: new_main
    rootDir: .                 # repository root

    buildCommand: npm install

    startCommand: node --experimental-sqlite src/server/index.js

    # Health check — Render pings this to decide if the deploy succeeded
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/trackify.db   # /tmp is writable on free plan (ephemeral)
      - key: JWT_SECRET
        sync: false               # set in Render dashboard → Environment tab
      - key: ALLOWED_ORIGIN
        sync: false               # set to your Vercel URL e.g. https://ipdltrackify.vercel.app
      - key: SARVAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

    # Persistent disk — NOT available on Free plan. Uncomment after upgrading to Starter.
    # disk:
    #   name: trackify-data
    #   mountPath: /var/data
    #   sizeGB: 1
